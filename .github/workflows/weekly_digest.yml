name: Weekly AI Trend Radar Digest

on:
  schedule:
    - cron: '0 8 * * 1' # Every Monday at 8am
  workflow_dispatch:     # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run pipeline
      env:
        # If using a cloud provider API, set it here in repository secrets
        # GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        PYTHONPATH: .
      run: |
        # Optional: Setup GCP auth if using Vertex AI
        # echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > gcp-key.json
        # export GOOGLE_APPLICATION_CREDENTIALS=gcp-key.json
        python src/main.py

    - name: Commit and push generated digest
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add -f output/digest-*.html items.db
        # Only commit if there are changes
        git diff --quiet && git diff --staged --quiet || (git commit -m "docs: Add weekly AI digest" && git push)
